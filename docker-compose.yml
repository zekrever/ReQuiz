services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: requiz
      POSTGRES_PASSWORD: requiz
      POSTGRES_DB: requiz
    ports:
      - "5432:5432"
    volumes:
      - requiz_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U requiz -d requiz"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: deps
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://requiz:requiz@db:5432/requiz
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: runner
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://requiz:requiz@db:5432/requiz
      COOKIE_SECURE: "false"
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Host source + lockfile. `npm ci` on start so new package.json deps land in Linux node_modules.
  dev:
    profiles: ["dev"]
    build:
      context: .
      target: deps
    command:
      [
        "sh",
        "-c",
        "npm ci --no-audit --no-fund && npx prisma generate && npm run dev -- -H 0.0.0.0 -p 3000",
      ]
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://requiz:requiz@db:5432/requiz
      COOKIE_SECURE: "false"
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - requiz_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  test:
    build:
      context: .
      target: test
    profiles: ["test"]

volumes:
  requiz_pg:
  requiz_node_modules:
